name: Build CAD Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "== ไฟล์ที่ root ของ repo =="
          ls -la
          for f in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/java/com/example/cadmobile/MainActivity.kt \
                   app/src/main/java/com/example/cadmobile/WasmAssetsHandler.kt \
                   web-extras/android-bridge.js; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; MISSING=1; fi
          done
          if [ -n "$MISSING" ]; then echo "::error::มีไฟล์หายหรือวางผิดตำแหน่ง (ดูรายการ MISSING ด้านบน)"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download latest CADCraft web build (+ verify checksum)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl && cd dl
          gh release download --repo storytold/cadcraft \
            --pattern '*web*.zip' --pattern 'SHA256SUMS.txt'
          ls -la
          sha256sum -c --ignore-missing SHA256SUMS.txt
          gh release view --repo storytold/cadcraft --json tagName -q .tagName > ../CADCRAFT_VERSION
          echo "CADCraft version: $(cat ../CADCRAFT_VERSION)"

      - name: Put web build into Android assets
        run: |
          mkdir -p web && unzip -q dl/*web*.zip -d web
          IDX=$(find web -name index.html | head -n 1)
          test -n "$IDX" || { echo "ไม่พบ index.html ในไฟล์ zip"; exit 1; }
          DEST=app/src/main/assets/cadcraft
          mkdir -p "$DEST"
          cp -r "$(dirname "$IDX")"/. "$DEST"/
          cp web-extras/android-bridge.js "$DEST"/
          sed -i '0,/<head[^>]*>/s//&\n<script src="android-bridge.js"><\/script>/' "$DEST/index.html"
          grep -n "android-bridge.js" "$DEST/index.html"

      - name: Decode signing key (optional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cad-mobile-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat CADCRAFT_VERSION)
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/release/*.apk \
            --title "CAD Mobile #${{ github.run_number }} (CADCraft $V)" \
            --notes "Built automatically from CADCraft $V"
